plan_count: 0
notes: >-
  Verified 2026-08-13. Albertsons publishes no API plans or pricing of any kind —
  not a tier list, not a "contact us" pricing page for the API. The 2025-01-07
  Albertsons Media Collective announcement says the API is available to
  participating advertisers and names no commercial terms. There is no reachable
  developer portal to sign up through: the recorded Azure API Management portal
  host does not resolve (SERVFAIL on the whole stratus.albertsons.com zone) and
  api.albertsons.com is a stale record with all ports filtered. Access is
  negotiated inside a Media Collective advertising agreement.
