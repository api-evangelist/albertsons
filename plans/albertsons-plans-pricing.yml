description: Albertsons does not operate a public developer portal with published API pricing. Commercial
  surface for retail-media and CPG-partner integrations runs through the Albertsons Media Collective and
  partner CPG / agency agreements. Pricing is bespoke and tied to media spend, retail-media campaigns,
  and data-collaboration commitments.
sources:
  - https://www.albertsons.com
  - https://www.albertsonsmediacollective.com
notes: No public API pricing surface. Plans below are placeholder partner-agreement shells; replace with
  contracted Media Collective / partner terms once known.
plans:
  - id: albertsons-partner
    name: Retail Media / CPG Partner Agreement
    type: enterprise
    description: Custom agreement covering retail-media campaigns, audience analytics, and CPG-partner
      data-collaboration APIs. Dimensioned by media spend or partner subscription.
    entries:
      - label: Partner Subscription
        description: Negotiated annual subscription / media-spend commit
        name: partner_subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Retail Media Campaign API
      - name: Audience Analytics API
      - name: CPG Partner Data API
      - name: Partner Account Management
