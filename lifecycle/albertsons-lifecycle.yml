host_verification:
  checked: '2026-08-13'
  summary: >-
    Every host on the recorded API surface fails to answer. This is the
    dead-host test applied to a spec that is itself AE-generated
    (openapi/*.yml carry info.x-generated-from: documentation), so nothing in
    openapi/ should be read as a provider-published contract.
  hosts:
    - host: portal-prod.apim.azwestus.stratus.albertsons.com
      role: Developer portal (apis.yml humanURL, Portal, Documentation, Authentication)
      resolves: false
      dns_status: SERVFAIL
      resolvers_tested:
        - 8.8.8.8
        - 1.1.1.1
        - 9.9.9.9
      http_status: null
      note: >-
        The whole stratus.albertsons.com zone SERVFAILs. It is delegated to
        ns5.safeway.com, ns6.safeway.com, ns7.safeway.com and ns8.safeway.com,
        which do not answer for it. Search engines still carry the portal (and a
        sibling portal-perf.apim.azwestus.stratus.albertsons.com/docs/services),
        so the Azure API Management developer portal existed and has since been
        withdrawn or moved behind a private zone. Broken delegation to a
        third-party nameserver set is also a subdomain-takeover-shaped exposure
        worth flagging to the provider.
    - host: api.albertsons.com
      role: API base URL (apis.yml baseURL, OpenAPI servers[])
      resolves: true
      a_record: 67.217.96.64
      ptr: 67-217-96-64.mywebgrocer.com
      tcp_443: filtered
      tcp_80: filtered
      http_status: null
      note: >-
        Resolves to a MyWebGrocer address. MyWebGrocer was the legacy grocery
        e-commerce vendor Albertsons banners used before the current platform;
        the A record survives the platform it pointed at. Every HTTP and HTTPS
        request to /, /openapi.json, /swagger.json, /api-docs, /docs, /graphql,
        /mcp and /.well-known/agent-card.json timed out after 20s. This is a
        stale DNS record, not a live API base.
    - host: www.albertsons.com
      role: Corporate / consumer site
      resolves: true
      http_status: 200
      note: Live consumer storefront behind Imperva/Incapsula. No API surface.
    - host: www.albertsonsmediacollective.com
      role: Retail media network marketing site
      resolves: true
      http_status: 403
      note: >-
        Cloudflare interstitial ("Just a moment...") to automated clients. Q4 Inc.
        investor-relations CMS. Marketing and contact pages only; no developer
        documentation, no spec, no console.
