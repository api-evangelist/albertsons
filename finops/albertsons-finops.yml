principles:
  - name: Visibility
    description: Track Media Collective spend and campaign performance via Albertsons partner reporting;
      tie API consumption to specific campaigns or data-collaboration projects.
  - name: Allocation
    description: Allocate media spend and API integration costs across brands and product lines.
  - name: Optimization
    description: Right-size media spend and integration footprint at annual renewal; consolidate underused
      campaigns.
  - name: Accountability
    description: Owned by retail-media / shopper-marketing leads on the partner side; reviewed against
      campaign ROAS and category sell-through.
