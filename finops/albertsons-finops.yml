description: >-
  Albertsons publishes nothing FinOps-relevant about its API. There are no public
  meter rates, no billing frequency, no currency and no charge model for API
  access — the only public statement is the 2025-01-07 Albertsons Media Collective
  announcement, which names no commercial terms. This file records that measured
  absence so nothing downstream infers a billing posture from an empty surface.
