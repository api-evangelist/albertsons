    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Albertsons Partner APIs
  ServiceCategory: Retail Media
  ProviderName: Albertsons
  PublisherName: Albertsons Companies, Inc.
  InvoiceIssuerName: Albertsons Companies, Inc.
