  - https://www.albertsonscompanies.com/newsroom/press-releases/news-details/2025/Albertsons-Media-Collective-Enables-Advertisers-to-Measure-Performance-with-Greater-Ease-and-Frictionless-Access-Via-New-API-Offering-and-TransUnion-Partnership/default.aspx
