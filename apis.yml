    description: >-
      The Albertsons Media Collective API enables advertisers to integrate with Albertsons
      retail media network for campaign management and performance analytics. The
      API provides near-real-time access to campaign performance data, allowing advertisers
      to bring data into their own measurement models for analysis. The developer
      portal, built on Microsoft Azure API Management, provides API documentation,
      code samples, and an interactive console for testing.
description: >-
