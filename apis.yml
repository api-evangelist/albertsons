  - type: Features
    data:
      - name: Near-Real-Time Campaign Performance
        description: >-
          Access advertising campaign performance data in near-real-time to bring metrics into custom dashboards and
          measurement models.
      - name: Audience Targeting
        description: >-
          Target campaigns using audience segments derived from Albertsons shopper purchase behavior across grocery and
          pharmacy banners.
      - name: Campaign Management
        description: >-
          Create, update, and manage advertising campaigns with budget controls, scheduling, and audience targeting
          configurations.
      - name: Custom Reporting
        description: >-
          Generate configurable performance reports with custom dimensions and metrics for export to external analytics
          tools.
      - name: Azure API Management Portal
        description: >-
          Interactive developer portal built on Microsoft Azure API Management with documentation, code samples, and an
          API testing console.
      - name: Multi-Banner Reach
        description: Access to shopper audiences across Albertsons, Safeway, Vons, Jewel-Osco, Acme, and other banner networks.
  - type: UseCases
    data:
      - name: Campaign Performance Dashboards
        description: >-
          Pull near-real-time campaign metrics into custom brand or agency dashboards for monitoring impressions,
          clicks, and ROAS.
      - name: Automated Budget Optimization
        description: Integrate campaign performance data into automated bidding and budget allocation systems.
      - name: Third-Party Measurement Integration
        description: >-
          Share campaign performance data with measurement partners like TransUnion for attribution and audience
          analysis.
      - name: Media Mix Modeling
        description: Incorporate Albertsons retail media performance data into multi-channel media mix models.
      - name: Audience Insights
        description: Analyze shopper audience segments to inform product marketing strategy and campaign targeting decisions.
  - type: Integrations
    data:
      - name: TransUnion
        description: Partnership integration for enhanced audience measurement and identity resolution using TransUnion data.
      - name: Microsoft Azure
        description: Developer portal and API gateway infrastructure built on Microsoft Azure API Management.
      - name: Analytics Platforms
        description: Export campaign data to third-party analytics dashboards and reporting tools via the Performance API.
description: >-
  Albertsons Companies is one of the largest food and drug retailers in the United States, operating supermarkets and
  pharmacies under banners including Albertsons, Safeway, Vons, Jewel-Osco, Acme, Shaw's, Star Market, and others. The
  company operates the Albertsons Media Collective, a retail media network that provides advertisers API access to
  near-real-time campaign performance data and audience targeting capabilities based on shopper purchase behavior across
  its banner network.
