x-coverage:
  state: gated
  reason: sales-gate
  detail: >-
    The Albertsons Media Collective API announced 2025-01-07 is issued only inside an
    advertising agreement, and the Azure API Management developer portal that fronted it
    is gone — the entire stratus.albertsons.com DNS zone now returns SERVFAIL from every
    public resolver, and the recorded base host api.albertsons.com is a stale record
    pointing at a decommissioned MyWebGrocer address with TCP 80 and 443 filtered, so
    there is no public reference or spec left to read.
  evidence:
    - url: https://portal-prod.apim.azwestus.stratus.albertsons.com/
      status: 0
