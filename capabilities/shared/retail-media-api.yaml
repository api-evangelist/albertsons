naftiko: "1.0.0-alpha1"

info:
  label: "Albertsons Media Collective API"
  description: "Retail media advertising campaign management and performance analytics API for the Albertsons Media Collective platform."
  tags:
    - Albertsons
    - Retail Media
    - Advertising
    - Campaigns
    - Analytics
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      ALBERTSONS_API_TOKEN: ALBERTSONS_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: retail-media-api
      baseUri: https://api.albertsons.com
      description: "Albertsons Media Collective API for retail media campaign management and performance analytics."
      authentication:
        type: bearer
        token: "{{ALBERTSONS_API_TOKEN}}"
      resources:
        - name: campaigns
          path: /campaigns
          description: "Manage advertising campaigns on the Albertsons Media Collective."
          operations:
            - name: list-campaigns
              method: GET
              description: "Retrieve a list of advertising campaigns with status and budget details."
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter campaigns by status (active, paused, completed, draft)."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of campaigns to return."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Number of campaigns to skip for pagination."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-campaign
              method: POST
              description: "Create a new advertising campaign with budget and targeting parameters."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  budget: "{{tools.budget}}"
                  startDate: "{{tools.startDate}}"
                  endDate: "{{tools.endDate}}"
                  targetAudienceIds: "{{tools.targetAudienceIds}}"
        - name: campaign-by-id
          path: /campaigns/{campaignId}
          description: "Retrieve details for a specific advertising campaign."
          operations:
            - name: get-campaign
              method: GET
              description: "Retrieve details for a specific campaign by ID."
              inputParameters:
                - name: campaignId
                  in: path
                  type: string
                  required: true
                  description: "Unique identifier of the campaign."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: performance
          path: /performance
          description: "Access near-real-time campaign performance metrics."
          operations:
            - name: list-performance-metrics
              method: GET
              description: "Retrieve near-real-time performance metrics including impressions, clicks, conversions, and ROAS."
              inputParameters:
                - name: campaignId
                  in: query
                  type: string
                  required: false
                  description: "Filter metrics by campaign identifier."
                - name: startDate
                  in: query
                  type: string
                  required: false
                  description: "Start date for metrics window (ISO 8601)."
                - name: endDate
                  in: query
                  type: string
                  required: false
                  description: "End date for metrics window (ISO 8601)."
                - name: granularity
                  in: query
                  type: string
                  required: false
                  description: "Time granularity for metrics aggregation (daily, weekly, monthly)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: audiences
          path: /audiences
          description: "Manage audience targeting segments for campaigns."
          operations:
            - name: list-audiences
              method: GET
              description: "Retrieve audience segments available for campaign targeting based on shopper behavior."
              inputParameters:
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Filter audiences by product category."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of audience segments to return."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: reports
          path: /reports
          description: "Generate custom performance reports for advertising campaigns."
          operations:
            - name: generate-report
              method: POST
              description: "Generate a custom performance report with specified dimensions and metrics."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  campaignIds: "{{tools.campaignIds}}"
                  startDate: "{{tools.startDate}}"
                  endDate: "{{tools.endDate}}"
                  dimensions: "{{tools.dimensions}}"
                  metrics: "{{tools.metrics}}"
                  format: "{{tools.format}}"

  exposes:
    - type: rest
      port: 8100
      namespace: albertsons-retail-media-rest
      resources:
        - path: /v1/campaigns
          name: campaigns
          description: "Advertising campaign management."
          operations:
            - method: GET
              name: list-campaigns
              description: "List all advertising campaigns."
              call: "retail-media-api.list-campaigns"
              with:
                status: "rest.status"
                limit: "rest.limit"
                offset: "rest.offset"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-campaign
              description: "Create a new advertising campaign."
              call: "retail-media-api.create-campaign"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/campaigns/{campaignId}
          name: campaign-by-id
          description: "Retrieve a specific campaign."
          operations:
            - method: GET
              name: get-campaign
              description: "Get campaign details by ID."
              call: "retail-media-api.get-campaign"
              with:
                campaignId: "rest.campaignId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/performance
          name: performance
          description: "Campaign performance metrics."
          operations:
            - method: GET
              name: list-performance-metrics
              description: "Retrieve campaign performance metrics."
              call: "retail-media-api.list-performance-metrics"
              with:
                campaignId: "rest.campaignId"
                startDate: "rest.startDate"
                endDate: "rest.endDate"
                granularity: "rest.granularity"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/audiences
          name: audiences
          description: "Audience targeting segments."
          operations:
            - method: GET
              name: list-audiences
              description: "List available audience targeting segments."
              call: "retail-media-api.list-audiences"
              with:
                category: "rest.category"
                limit: "rest.limit"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/reports
          name: reports
          description: "Custom performance reports."
          operations:
            - method: POST
              name: generate-report
              description: "Generate a custom performance report."
              call: "retail-media-api.generate-report"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: albertsons-retail-media-mcp
      transport: http
      tools:
        - name: list-campaigns
          description: "List advertising campaigns on the Albertsons Media Collective with status and budget details."
          hints:
            readOnly: true
            openWorld: true
          call: "retail-media-api.list-campaigns"
          with:
            status: "tools.status"
            limit: "tools.limit"
            offset: "tools.offset"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-campaign
          description: "Create a new advertising campaign with budget, targeting, and scheduling parameters."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "retail-media-api.create-campaign"
          with:
            name: "tools.name"
            budget: "tools.budget"
            startDate: "tools.startDate"
            endDate: "tools.endDate"
            targetAudienceIds: "tools.targetAudienceIds"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-campaign
          description: "Get details for a specific advertising campaign by its identifier."
          hints:
            readOnly: true
            openWorld: true
          call: "retail-media-api.get-campaign"
          with:
            campaignId: "tools.campaignId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-performance-metrics
          description: "Retrieve near-real-time performance metrics including impressions, clicks, conversions, and ROAS for campaigns."
          hints:
            readOnly: true
            openWorld: true
          call: "retail-media-api.list-performance-metrics"
          with:
            campaignId: "tools.campaignId"
            startDate: "tools.startDate"
            endDate: "tools.endDate"
            granularity: "tools.granularity"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-audiences
          description: "List audience targeting segments available for campaigns, based on Albertsons shopper purchase behavior."
          hints:
            readOnly: true
            openWorld: true
          call: "retail-media-api.list-audiences"
          with:
            category: "tools.category"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: generate-report
          description: "Generate a custom performance report for advertising campaigns with specified dimensions and metrics."
          hints:
            readOnly: true
            openWorld: false
          call: "retail-media-api.generate-report"
          with:
            campaignIds: "tools.campaignIds"
            startDate: "tools.startDate"
            endDate: "tools.endDate"
            dimensions: "tools.dimensions"
            metrics: "tools.metrics"
            format: "tools.format"
          outputParameters:
            - type: object
              mapping: "$."
